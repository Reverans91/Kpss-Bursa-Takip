
name: Otomatik KPSS Bursa İlan Taraması

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli paketleri kur
        run: pip install requests feedparser

      - name: İlanları tara
        run: python ilan_tara.py

      - name: İlanları kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ilanlar.json
          git diff --cached --quiet || git commit -m "İlanlar güncellendi"
          git push
