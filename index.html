
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPSS Bursa İlan Takip</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fb;
  color: #172033;
}

header {
  background: linear-gradient(135deg, #173b73, #2878d0);
  color: white;
  padding: 25px 18px;
}

header h1 {
  margin: 0 0 8px;
  font-size: 25px;
}

header p {
  margin: 0;
  opacity: .9;
}

.container {
  padding: 16px;
  max-width: 850px;
  margin: auto;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.stat {
  background: white;
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 2px 8px #00000008;
}

.stat strong {
  display: block;
  font-size: 24px;
  color: #2466bd;
}

.stat span {
  font-size: 13px;
  color: #687386;
}

.filters {
  background: white;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 18px;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d5dce7;
  border-radius: 9px;
  margin: 6px 0 12px;
  font-size: 15px;
  background: white;
}

button {
  border: none;
  background: #2466bd;
  color: white;
  padding: 12px 16px;
  border-radius: 9px;
  font-size: 15px;
  cursor: pointer;
}

button.secondary {
  background: #e8eef8;
  color: #24518b;
}

.job {
  background: white;
  border-radius: 14px;
  padding: 17px;
  margin-bottom: 13px;
  box-shadow: 0 2px 8px #00000008;
  border-left: 5px solid #2878d0;
}

.job h3 {
  margin: 0 0 10px;
  font-size: 18px;
  line-height: 1.4;
}

.job p {
  color: #5e6878;
  font-size: 14px;
  line-height: 1.5;
}

.tag {
  display: inline-block;
  background: #e8f1ff;
  color: #245da7;
  padding: 5px 9px;
  border-radius: 6px;
  font-size: 12px;
  margin: 3px 3px 5px 0;
}

.tag.warning {
  background: #fff2d7;
  color: #8a5a00;
}

.job a {
  display: inline-block;
  margin-top: 10px;
  text-decoration: none;
  color: #2466bd;
  font-weight: bold;
}

#status {
  color: #5e6878;
  font-size: 14px;
  margin: 12px 0;
}

.sources {
  background: white;
  padding: 18px;
  border-radius: 14px;
  margin-top: 25px;
}

.sources a {
  display: block;
  margin: 10px 0;
  color: #2466bd;
}

footer {
  text-align: center;
  padding: 25px;
  font-size: 12px;
  color: #7b8493;
}

</style>
</head>

<body>

<header>
  <h1>📋 KPSS Bursa İlan Takip</h1>
  <p>Bursa kamu ilanları • KPSS • Personel alımları</p>
</header>

<div class="container">

  <div class="stats">
    <div class="stat">
      <strong id="total">0</strong>
      <span>Toplam ilan</span>
    </div>

    <div class="stat">
      <strong id="visible">0</strong>
      <span>Filtreye uygun sonuç</span>
    </div>
  </div>

  <div class="filters">
    <h3>🔎 İlan ara</h3>

    <input id="search"
      placeholder="İlan, kurum veya meslek ara...">

    <select id="type">
      <option value="all">Tüm ilanlar</option>
      <option value="official">Resmî kurum bağlantıları</option>
      <option value="kpss">KPSS / memur ilanları</option>
      <option value="education">Ön lisans / büro ilanları</option>
    </select>

    <button onclick="filterJobs()">Ara</button>
    <button class="secondary" onclick="resetFilters()">Temizle</button>

    <div id="status">İlanlar yükleniyor...</div>
  </div>

  <div id="jobs"></div>

  <div class="sources">
    <h3>🏛️ Resmî kurumlar</h3>
    <div id="official"></div>
  </div>

</div>

<footer>
  KPSS Bursa İlan Takip • İlan şartlarını kurumun resmî duyurusundan kontrol et.
</footer>

<script>
let allJobs = [];
let officialSources = [];

async function loadData() {
  try {
    const response = await fetch("ilanlar.json");

    if (!response.ok) {
      throw new Error("ilanlar.json yüklenemedi");
    }

    const data = await response.json();

    allJobs = data.jobs || [];
    officialSources = data.official_sources || [];

    document.getElementById("total").textContent =
      allJobs.length;

    document.getElementById("status").textContent =
      "Son güncelleme: " +
      (data.updated_at || "Bilinmiyor");

    showOfficial();
    filterJobs();

  } catch (error) {
    document.getElementById("status").textContent =
      "İlanlar yüklenemedi. GitHub dosyalarını kontrol et.";
  }
}

function filterJobs() {
  const search = document.getElementById("search")
    .value.toLowerCase().trim();

  const type = document.getElementById("type").value;

  let filtered = allJobs.filter(job => {
    const title = (job.title || "").toLowerCase();
    const source = (job.source || "").toLowerCase();
    const summary = (job.summary || "").toLowerCase();

    const text = title + " " + source + " " + summary;

    const searchMatch = !search || text.includes(search);

    let typeMatch = true;

    if (type === "official") {
      typeMatch = false;
    }

    if (type === "kpss") {
      typeMatch = /kpss|memur|personel|kamu/i.test(text);
    }

    if (type === "education") {
      typeMatch = /ön lisans|önlisans|büro|işletme|personel/i.test(text);
    }

    return searchMatch && typeMatch;
  });

  document.getElementById("visible").textContent =
    filtered.length;

  if (type === "official") {
    document.getElementById("jobs").innerHTML =
      "<p>Resmî kurum bağlantıları aşağıda listeleniyor.</p>";
    return;
  }

  renderJobs(filtered);
}

function renderJobs(jobs) {
  const container = document.getElementById("jobs");

  if (!jobs.length) {
    container.innerHTML =
      "<p>Aramana uygun ilan bulunamadı.</p>";
    return;
  }

  container.innerHTML = jobs.map(job => {
    const title = escapeHTML(job.title || "Başlıksız ilan");
    const source = escapeHTML(job.source || "Kaynak belirtilmemiş");
    const date = escapeHTML(job.date || "Tarih belirtilmemiş");
    const status = escapeHTML(job.match_status || "İncelenecek");
    const warnings = job.warnings || [];

    const warningHTML = warnings.map(w =>
      `<span class="tag warning">${escapeHTML(w)}</span>`
    ).join("");

    const url = safeURL(job.url);

    return `
      <div class="job">
        <h3>${title}</h3>

        <span class="tag">${source}</span>
        <span class="tag">${status}</span>

        <p>📅 ${date}</p>

        ${warningHTML}

        ${url ? `<a href="${url}" target="_blank" rel="noopener">İlanı / kaynağı aç ↗</a>` : ""}

      </div>
    `;
  }).join("");
}

function showOfficial() {
  const container = document.getElementById("official");

  container.innerHTML = officialSources.map(source => {
    const name = escapeHTML(source.title || source.name || "Kurum");
    const url = safeURL(source.url);

    return url
      ? `<a href="${url}" target="_blank" rel="noopener">${name} ↗</a>`
      : "";
  }).join("");
}

function resetFilters() {
  document.getElementById("search").value = "";
  document.getElementById("type").value = "all";
  filterJobs();
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

function safeURL(value) {
  try {
    const url = new URL(value);

    if (url.protocol === "https:" || url.protocol === "http:") {
      return escapeHTML(url.href);
    }
  } catch (e) {}

  return "";
}

document.getElementById("search")
  .addEventListener("input", filterJobs);

document.getElementById("type")
  .addEventListener("change", filterJobs);

loadData();
</script>

</body>
</html>
